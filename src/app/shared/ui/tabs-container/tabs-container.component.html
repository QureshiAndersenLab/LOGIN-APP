<div class="flex flex-col gap-8">
  <div>
    <ul class="flex gap-8">
      @for (tab of tabs; track tab.tabTitle()){
      <div class="flex flex-col gap-[3px]">
        <li
          [ngClass]="{ 'font-semibold': tab.active() }"
          (click)="selectTab(tab)"
        >
          {{ tab.tabTitle() }}
        </li>
        @if(tab.active()){
        <div class="h-1 bg-black w-[100%]"></div>
        }
      </div>
      }
    </ul>
    <div
      class="border-b-2 lg:min-w-[920px] md:min-w-[700px] max-sm:min-w-[400px]"
    ></div>
  </div>

  <ng-content> </ng-content>
</div>
