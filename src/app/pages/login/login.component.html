<div class="flex flex-col md:flex-row h-screen">
  <div class="relative w-full md:w-[600px] h-full">
    <img
      src="assets/allianz-login.png"
      alt="Insurance Lady"
      class="w-full h-full object-cover absolute"
    />
    <div
      class="absolute inset-0 flex flex-col items-center justify-center text-white text-center px-4 bg-black/40"
    >
      <h2 class="text-[18px] md:text-[28px] tracking-[0.2px]">
        Welcome to your
      </h2>
      <h2 class="text-[32px] md:text-[40px] font-bold tracking-[0.2px]">
        Insurance portal
      </h2>
      <p
        class="w-[350px] md:w-[450px] text-sm md:text-[20px] leading-[18px] md:leading-[24px] text-center align-middle"
      >
        Your complete insurance hub – manage your policies, file claims, and
        discover customized coverage solutions with simplicity
      </p>
    </div>
  </div>

  <div
    class="bg-white w-full md:w-1/2 px-8 pt-8 pb-14 flex flex-col justify-center gap-8"
  >
    <div class="flex items-center justify-start gap-2 text-brandBlue">
      <img src="assets/icons/back-arrow.png" alt="back-arrow" />
      <button type="button" (click)="goBack()">Back</button>
    </div>

    <div class="flex flex-col justify-center items-center h-full">
      <form class="flex flex-col gap-8 w-full max-w-md">
        <div class="flex flex-col gap-3">
          <p class="font-[550] text-[30px] leading-[40px] tracking-[0.3px]">
            Log In
          </p>
          <p class="font-[400] text-4 leading-[24px] tracking-[0.3px]">
            Please enter your email address assigned to your Deutsche Bank
            account
          </p>
        </div>

        <div class="flex flex-col gap-2">
          <label
            for="email"
            class="font-[400] text-4 leading-[24px] tracking-[0.2px]"
          >
            Email Address
          </label>
          <input
            type="email"
            name="email"
            class="w-full px-2 py-1 border-b"
            required
          />
        </div>
        <button
          type="submit"
          class="py-3 px-8 font-[550] text-4 leading-[24px] tracking-[0.2px] bg-brandBlue text-white rounded-sm disabled:bg-[#C2C2C2]"
          disabled
        >
          Continue
        </button>
      </form>
    </div>
  </div>
</div>
