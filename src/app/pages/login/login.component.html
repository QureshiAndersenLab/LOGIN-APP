<div class="bg-black flex max-md:flex-col">
  <img
    src="assets/login-side.png"
    alt="Logo"
    class="w-1/2 object-cover max-md:w-full max-md:h-60"
  />

  <div class="bg-white w-full px-8 pt-8 pb-14 flex flex-col gap-8 sm:gap-0">
    <div class="flex items-center justify-start gap-2 text-brandBlue">
      <img src="assets/icons/back-arrow.png" alt="back-arrow" />
      <button type="button" (click)="goBack()">Back</button>
    </div>

    <div class="h-full flex flex-col justify-center items-center">
      <form class="flex flex-col gap-8">
        <div class="flex flex-col gap-3">
          <p
            class="font-[550] text-[30px] leading-[40px] tracking-[0.3px] align-middle"
          >
            Log In
          </p>
          <p class="font-[400] text-4 leading-[24px] tracking-[0.3px]">
            Please enter your email address assigned to your Deutsche Bank
            account
          </p>
        </div>

        <div class="flex flex-col gap-2">
          <label
            for="email"
            class="font-[400] text-4 leading-[24px] tracking-[0.2px]"
            >Email Address</label
          >
          <input
            type="email"
            name="email"
            class="w-full px-2 py-1 border-b"
            required
          />
        </div>
        <button
          type="submit"
          class="py-3 px-8 font-[550] text-4 leading-[24px] tracking-[0.2px] bg-brandBlue text-white rounded-sm disabled:bg-[#C2C2C2]"
          disabled
        >
          Continue
        </button>
      </form>
    </div>
  </div>
</div>
