<div class="border-[1px] rounded">
  <div class="flex gap-4 items-center border-b px-4 pb-3 pt-4">
    <p
      class="font-[550] text-sm md:text-[22px] leading-[24px] tracking-[0.2px]"
    >
      {{ creditCard().cardName }}
    </p>
    <span
      class="font-[550] text-sm md:text-[22px] leading-[24px] tracking-[0.2px]"
      >|</span
    >
    <p
      class="font-[550] text-sm md:text-[22px] leading-[24px] tracking-[0.2px]"
    >
      {{ creditCard().number | maskCardNumber }}
    </p>
  </div>

  <div class="flex flex-col">
    @for (policy of creditCard().policies; track $index) {
    <app-policy-card [policy]="policy" />
    }
  </div>
</div>
