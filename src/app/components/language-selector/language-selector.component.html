<div class="relative inline-block text-left">
  <button (click)="toggleDropdown()" class="flex gap-2 items-center">
    <svg
      width="23"
      height="23"
      viewBox="0 0 23 23"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Language globe icon"
    >
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M11.6562 0.546875C5.59125 0.546875 0.65625 5.48187 0.65625 11.5469C0.65625 17.6119 5.59125 22.5469 11.6562 22.5469C17.7213 22.5469 22.6562 17.6119 22.6562 11.5469C22.6562 5.48187 17.7222 0.546875 11.6562 0.546875ZM21.0562 11.5469C21.0562 12.3519 20.9513 13.1309 20.7612 13.8759H16.7453C16.9212 12.8419 16.9573 12.0109 16.9573 11.5469C16.9573 10.6289 16.8573 9.77988 16.7113 8.97488H20.6963C20.9272 9.79288 21.0562 10.6539 21.0562 11.5469ZM7.65625 11.5469C7.65625 10.6259 7.75825 9.77188 7.91925 8.97588L15.3923 8.97488C15.5533 9.77188 15.6553 10.6259 15.6553 11.5469C15.6553 11.8229 15.6442 12.6979 15.4242 13.8759H7.88625C7.66825 12.6979 7.65625 11.8229 7.65625 11.5469ZM20.2202 7.67487H16.4112C15.7372 5.28888 14.5662 3.48787 13.6292 2.35787C16.5742 2.98688 19.0063 4.99587 20.2202 7.67487ZM11.6562 2.14688C12.0413 2.50488 14.0462 4.43887 15.0623 7.67487H8.25025C9.26625 4.43887 11.2723 2.50488 11.6562 2.14688ZM9.68425 2.35787C8.74725 3.48787 7.57625 5.28887 6.90225 7.67587H3.09225C4.30625 4.99687 6.73825 2.98787 9.68425 2.35787ZM2.61725 8.97587H6.60225C6.45525 9.78088 6.35625 10.6299 6.35625 11.5469C6.35625 12.0109 6.39225 12.8419 6.56825 13.8759H2.55225C2.36225 13.1309 2.25725 12.3519 2.25725 11.5469C2.25625 10.6549 2.38525 9.79288 2.61725 8.97587ZM2.99225 15.1759H6.84625C7.28725 16.8779 8.11725 18.8869 9.67225 20.7329C6.64525 20.0819 4.16525 17.9709 2.99225 15.1759ZM8.19325 15.1759H15.1203C14.6083 16.9739 13.6093 19.1299 11.6562 20.9469C9.70325 19.1299 8.70425 16.9739 8.19325 15.1759ZM13.6403 20.7329C15.1962 18.8869 16.0253 16.8779 16.4663 15.1759H20.3202C19.1472 17.9709 16.6683 20.0819 13.6403 20.7329Z"
        fill="#0C164B"
      />
    </svg>

    <span data-testId="selected-lang"> {{ currentLanguage() }} </span>

    <svg
      width="16"
      height="9"
      viewBox="0 0 16 9"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Language dropdown icon"
    >
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M15.7072 0.29325C15.3162 -0.09775 14.6842 -0.09775 14.2933 0.29325L8.00025 6.58625L1.70725 0.29325C1.31625 -0.09775 0.68425 -0.09775 0.29325 0.29325C-0.09775 0.68425 -0.09775 1.31625 0.29325 1.70725L7.29325 8.70725C7.48825 8.90225 7.74425 9.00025 8.00025 9.00025C8.25625 9.00025 8.51225 8.90225 8.70725 8.70725L15.7072 1.70725C16.0982 1.31625 16.0982 0.68425 15.7072 0.29325Z"
        fill="#0C164B"
      />
    </svg>
  </button>

  @if (showDropdown()) {
  <ul
    data-testId="lang-dropdown"
    class="absolute right-0 mt-2 w-20 sm:w-24 bg-white border border-gray-200 rounded shadow-md z-50"
  >
    @for (lang of availableLanguages(); track lang.code) {
    <li
      (click)="selectLanguage(lang.code)"
      class="flex gap-2 px-4 py-2 hover:bg-gray-100 cursor-pointer text-xs sm:text-sm"
    >
      <div>
        <span
          data-testId="lang-code"
          class="w-4 h-4 rounded-sm bg-gray-200 flex items-center justify-center text-xs font-bold mr-3"
        >
          {{ lang.code }}
        </span>

        <div class="flex flex-col">
          <span class="font-medium">{{ lang.nativeName }}</span>
          <span class="text-xs text-gray-500">{{ lang.name }}</span>
        </div>
      </div>

      @if (currentLanguage() === lang.code) {
      <svg
        class="w-4 h-4 ml-auto text-indigo-600"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
          clip-rule="evenodd"
        />
      </svg>
      }
    </li>
    }
  </ul>
  }
</div>
